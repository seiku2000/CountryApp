<!-- esta es una pagina independiente recibe datos del hijo mediante un output 
  para el input  pasamos placeholder desde el padre 
-->

<app-country-input-search (eventBackSpace)="onBackSpace($event)" (value)="onSearch($event)"
  [placeHolder]="'buscar por capital'"></app-country-input-search>

<app-country-table [countries]="capitalResoure.value() ?? [] " [errorMessage]="capitalResoure.error()?.message"
  [isEmpty]="capitalResoure.value()?.length === 0" [isLoading]="capitalResoure.isLoading()"
  [emptyMessageError]="emptyError()"></app-country-table>
