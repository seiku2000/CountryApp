<!-- esta es una pagina independiente recibe datos del hijo mediante un output 
  para el input  pasamos placeholder desde el padre 
-->

<app-country-input-search (value)="onSearch($event)" [placeHolder]="'buscar por capital'"></app-country-input-search>

@if (emptyError() || countryRsource.error()) {
<div class="alert alert-error shadow-lg mt-4">
  <span>
    {{ emptyError() || countryRsource.error()?.message }}
  </span>
</div>
}
@else if(countryRsource.hasValue()){
<app-country-table [countries]="countryRsource.value()! "></app-country-table>
}
