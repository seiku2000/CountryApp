<app-country-input-search (eventBackSpace)="onBackSpace($event)" (value)="onSearch($event)"
    [placeHolder]="'buscar por Country'"></app-country-input-search>


<app-country-table [countries]="capitalResource.value() ?? [] " [errorMessage]="capitalResource.error()?.message"
    [isEmpty]="capitalResource.value()?.length === 0" [isLoading]="capitalResource.isLoading()"
    [emptyMessageError]="emptyError()"></app-country-table>
