<app-country-input-search (value)="onSearch($event)" [placeHolder]="'buscar por pais'"></app-country-input-search>


@if (emptyError() || capitalResource.error()) {
<div class="alert alert-error shadow-lg mt-4">
    <span>
        {{ emptyError() || capitalResource.error()?.message }}
    </span>
</div>
} @else if(capitalResource.hasValue()){
<app-country-table [countries]="capitalResource.value() "></app-country-table>
}
