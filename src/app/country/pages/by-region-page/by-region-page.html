<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 ">
    @for (region of Regions; track region; let index = $index) {
    <button (click)="onSelectRegion(region)" class="btn btn-wide  " [class.btn-primary]="query()===region">{{
        region
        }}</button>

    }
</div>
<app-country-table [countries]="regionResource.value() ?? []"></app-country-table>
