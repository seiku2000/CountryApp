<section class="flex flex-row gap-2 mt-2">
    <input type="text" class="input input-bordered mr-2 w-full bg-base-100   hover:bg-base-200"
        placeholder={{placeHolder()}} autofocus #txtSearch (keyup.enter)="onSearch(txtSearch.value)"
       />

    <button class="btn btn-primary" (click)="onSearch(txtSearch.value)"><svg aria-label="Search"
            xmlns="http://www.w3.org/2000/svg" class="size-5 sm:size-6" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg></button>


</section>
