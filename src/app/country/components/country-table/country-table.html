<section class="mt-4 md:mt-6 lg:mt-8  mb-6 md:mb-0      ">
    <div class="overflow-x-auto rounded-box border border-base-content/10 bg-base-200 shadow-sm">
        <table class="table table-sm  table-md table-lg ">
            <!-- head -->
            <thead class="bg-base-300 font-bold ">
                <tr>
                    <th>#</th>
                    <th>Icon</th>
                    <th>Bandera</th>
                    <th>Nombre</th>
                    <th>Capital</th>
                    <th>Población</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                @for (country of countries(); track country.uuid; let index = $index) {

                <tr class="hover:bg-base-100 cursor-pointer">

                    <td>{{ index + 1 }}</td>
                    <td>{{ country.flag.emoji}}</td>
                    <td>
                        <img [src]="country.flag.url_svg" [alt]="country.names.common" width="32" class="rounded">

                    </td>
                    <td>{{country.names.common}}</td>
                    <td>{{country.capitals.map((capital) => capital.name)}}</td>
                    <td>{{country.population}}</td>
                    <!---               <td>{{ country.flag.emoji }}</td>
                    <td>
                        <img [src]="country.flag.url_png" [alt]="country.names.common" width="32" class="rounded" />
                    </td>
                    <td>{{ country.names.common }}</td>
                    <td>{{ country.capitals[0]?.name }}</td>
                    <td>{{ country.population }}</td>
                    <td></td>-->

                </tr>

                }
